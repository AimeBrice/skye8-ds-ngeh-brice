name: CI

on:
  push:
    branches:
      - main
      - feat/*
  pull_request:
    branches:
      - main


jobs:
  quality-checks:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff black mypy pytest


      - name: Run Ruff
        run: |
          ruff check src/


      - name: Run Black
        run: |
          black --check src/


      - name: Run Mypy
        run: |
          mypy src/


      - name: Run Tests
        run: |
          pytest