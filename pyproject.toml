[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "price-pipeline"
version = "0.1.0"
description = "Incremental ETL pipeline for market price observations"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.0",
    "pytest>=8.0",
]

[project.scripts]
price-pipeline = "price_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.0",
]